# Minimal SearXNG settings for open-websearch.
#
# `formats: [html, json]` is REQUIRED: the edge server queries /search with
# `format=json`, which SearXNG disables by default.
use_default_settings: true

server:
  # Replace with a long random string before exposing this instance.
  secret_key: "change-me-to-a-random-string"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

ui:
  static_use_hash: true